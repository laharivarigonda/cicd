services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: cicd-backend

    restart: unless-stopped

    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: cicd-frontend

    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend
